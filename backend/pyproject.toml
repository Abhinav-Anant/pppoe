[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bng-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5,<3", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
# management plane (bng-api, bngctl admin/db); the data plane never imports these
api = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12", "SQLAlchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1"]

[project.scripts]
bngctl = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.db" = ["migrations/*.py", "migrations/versions/*.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
